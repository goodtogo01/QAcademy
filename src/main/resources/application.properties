spring.application.name=qacademy

server.port=8085

# H2 file database - the Java equivalent of qCampus's SQLite file, zero setup.
# File lives at ./data/qacademy.mv.db relative to wherever the app is run from.
spring.datasource.url=jdbc:h2:file:./data/qacademy
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Browse the database at http://localhost:8085/h2-console while the app is running
# (JDBC URL field must match spring.datasource.url above exactly).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# "validate" (not "update"/"create") so Hibernate checks the entity mappings
# against the Flyway-created schema at startup instead of silently improvising -
# catches a typo'd @Column name immediately rather than at first query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.issuer=qAcademyApi
jwt.audience=qAcademyClient
# Falls back to the placeholder below for local/demo runs (works fine, just not secret);
# set a real JWT_SECRET environment variable in Jenkins/any real deployment to override it
# without ever needing to edit or commit this file.
jwt.secret=${JWT_SECRET:REPLACE_THIS_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS_LONG}
jwt.expiration-hours=2

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs
