# Local-only overrides - activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# (or -Dspring.profiles.active=dev / SPRING_PROFILES_ACTIVE=dev for a packaged jar).
# Re-enables the H2 web console for local inspection at http://localhost:8085/h2-console -
# see the comment in application.properties for why this isn't on by default.
spring.h2.console.enabled=true

# Belt-and-suspenders: web-allow-others defaults to false anyway (console only accepts
# connections from the same machine the app is running on), but it's worth pinning
# explicitly here since it's the setting that matters most if this file is ever copied.
spring.h2.console.settings.web-allow-others=false
