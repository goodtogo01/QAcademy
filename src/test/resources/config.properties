base.url=http://localhost:8085
browser=chrome
env=LOCAL
implicit.wait.seconds=10
explicit.wait.seconds=15

# CHROME window: true/false forces it, "auto" (default) only goes headless when this
# looks like a CI build (env=CI below, or a GITHUB_ACTIONS/JENKINS_URL/CI env var set by
# the build agent itself) - a local `mvn test` run keeps showing the real browser.
headless=auto
# --- backend auto-start (BackendLifecycleManager) ---
# Checked against base.url above. All keys optional - each has a hardcoded default.

# Any open endpoint that touches the database, proving the whole stack (web + JPA +
# Flyway) actually booted, not just that a port is open. Defaults to ApiEndpoints.COURSE.
# backend.healthCheckPath=/api/course

# true  = auto-start the backend if it isn't already running (this is the feature).
# false = fail fast instead, telling you to start it yourself first.
backend.autoStart=true

# true  = stop the backend after the suite, but only if this framework started it.
# false = leave it running afterward (handy if you want to poke around manually).
backend.autoStop=true

# Budget (seconds) for a cold `mvn spring-boot:run` start - Maven resolution + Spring
# context + Flyway migrations + demo-data seeding. Raise this if your machine is slower.
backend.startupTimeoutSeconds=90

# Folder containing pom.xml. "." assumes tests run from the project root, which is the
# default for both `mvn test` and most IDE run configurations.
backend.projectDir=.

# Override only if you want to run a pre-built jar instead of `mvn spring-boot:run`,
# e.g.: backend.startCommand=java -jar target/qacademy.jar
# backend.startCommand=mvn spring-boot:run
