# src/test/resources/config.properties
# Automation Framework Design (AF-QACAD-001) §2 - the framework's one config file.
# Every key below has a hardcoded default in code, so this file only needs to list
# the values you actually want to override.

# --- existing / planned keys (Design §2) ---
# base.url=http://localhost:8085
# browser=chrome
# implicit.wait.seconds=5
# explicit.wait.seconds=15
# env=LOCAL

# --- backend auto-start (BackendLifecycleManager) ---

# Where the app listens. Must match server.port in application.properties.
backend.baseUrl=http://localhost:8085

# Any endpoint that's open (no auth) AND touches the database - proves the whole
# stack (web + JPA + Flyway) actually booted, not just that a port is open.
backend.healthCheckPath=/api/course

# true  = auto-start the backend if it isn't already running (this is the feature).
# false = fail fast instead, telling you to start it yourself first.
backend.autoStart=true

# true  = stop the backend after the suite, but only if this framework started it.
# false = leave it running afterward (handy if you want to poke around manually).
backend.autoStop=true

# Budget for a cold `mvn spring-boot:run` start (Maven resolution + Spring context
# + Flyway migrations + demo-data seeding). Raise this if your machine is slower.
backend.startupTimeoutSeconds=90

# Folder containing pom.xml. "." assumes tests run from the project root, which is
# the default for both `mvn test` and most IDE run configurations.
backend.projectDir=.

# Override only if you want to run a pre-built jar instead of `mvn spring-boot:run`,
# e.g.: backend.startCommand=java -jar target/qacademy.jar
# backend.startCommand=mvn spring-boot:run
